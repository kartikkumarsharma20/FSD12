<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    *{
        margin: 0px;
        padding: 0px;
        box-sizing: border-box;
    }
    html,body{
        height: 100%;
        width: 100%;
        background: #000000;
    }
    .container{
        height: 100%;
        width: 100%;
         padding: 2vh;
        background: #231d1d;
        color: aqua;
        display: grid;
        gap: 5px;
       grid-template-rows: repeat(4,1fr);
       grid-template-columns: repeat(3,1fr);  
    }
    .item{
        /* height: 100px;
        width: 100px; */
        background: #88824e;
        border: 1px solid aqua;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        
        
    }
    .header{
        grid-column-start: 1;
        grid-column-end: 4;
    }
    .sidebar{
        grid-row-start: 2;
        grid-row-end: 4;
    }
    .content1{
        grid-column-start: 2;
        grid-column-end: 4;
    }
    .footer{
        grid-column-start: 1;
        grid-column-end: 4;
    }
</style>
<body>
    <div class="container">

        <div class="item header">Header</div>
        <div class="item sidebar">Sidebar</div>
        <div class="item content1">Content 1</div>
        <div class="item Content2">Content 2</div>
        <div class="item Content3">Content 3</div>
        <div class="item footer">Footer</div>
    </div>
</body>
</html>
