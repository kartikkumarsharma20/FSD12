<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>3D Image Slider</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;

        display: flex;
        justify-content: center;
        align-items: center;

        background: #0f172a;

        font-family: Arial, sans-serif;
      }

      /* =====================================
           MAIN SLIDER
        ===================================== */

      .slider {
        width: 250px;
        height: 350px;

        /* position: relative; */

        transform-style: preserve-3d;

        animation: rotateSlider 12s linear infinite;
      }


       @keyframes rotateSlider {
        0% {
          transform: rotateY(0deg);
        }

        100% {
          transform: rotateY(360deg);
        }
      }
      /* =====================================
           IMAGE CARD
        ===================================== */

      .slide {
        position: absolute;

        width: 220px;
        height: 300px;

        left: 15px;
        top: 25px;

        border-radius: 15px;

        /* overflow: hidden; */

        box-shadow: 0 15px 30px rgba(0, 0, 0, 0.5);

        /*
                Transition makes transform smooth
            */

        transition: transform 0.5s ease;
      }

      .slide img {
        width: 100%;
        height: 100%;
        border-radius: 15px;
        box-shadow: 0 15px 30px rgba(224, 24, 24, 0.5);
        object-fit: cover;

      }
      .slide img:hover {
        transform: scale(1.5);
        box-shadow: 0 15px 30px rgba(24, 224, 214, 0.8);
        /* animation-play-state: paused; */
       
      }

      /* =====================================
           3D POSITIONING
        ===================================== */

      .slide:nth-child(1) {
        transform: rotateY(0deg) translateZ(350px);
      }

      .slide:nth-child(2) {
        transform: rotateY(60deg) translateZ(350px);
      }

      .slide:nth-child(3) {
        transform: rotateY(120deg) translateZ(350px);
      }

      .slide:nth-child(4) {
        transform: rotateY(180deg) translateZ(350px);
      }

      .slide:nth-child(5) {
        transform: rotateY(240deg) translateZ(350px);
      }

      .slide:nth-child(6) {
        transform: rotateY(300deg) translateZ(350px);
      }
    </style>
  </head>

  <body>
    
    <div class="slider">
      <div class="slide">
        <img
          src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee"
          alt="Nature"
        />
      </div>

      <div class="slide">
        <img
          src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e"
          alt="Beach"
        />
      </div>

      <div class="slide">
        <img
          src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e"
          alt="Forest"
        />
      </div>

      <div class="slide">
        <img
          src="https://images.unsplash.com/photo-1519681393784-d120267933ba"
          alt="Mountain"
        />
      </div>

      <div class="slide">
        <img
          src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e"
          alt="Lake"
        />
      </div>

      <div class="slide">
        <img
          src="https://images.unsplash.com/photo-1501785888041-af3ef285b470"
          alt="Landscape"
        />
      </div>
    </div>
  </body>
</html>
