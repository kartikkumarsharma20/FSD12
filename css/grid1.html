<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    *{
        margin: 0px;
        padding: 0px;
        box-sizing: border-box;
    }
    html,body{
        height: 100vh;
        width: 100vw;
        background: #000;
    }
    .container{
        height: 100%;
        width: 100%;
        padding: 1rem;
        background: #c1d2d4;
        display: grid;
        grid-template-columns: 40% 20%;
        grid-template-rows:15% 70% 15%;
        /* gap:5px; */
    }

    .item{
        background: #000;
        color: aqua;
      /* border: 2px solid rgb(180, 155, 155); */
      display: flex;
      justify-content: center;
      align-items: center;
      font-size:20px;
    }
    .nav{
        grid-column-start:1;
        grid-column-end:4;

    }
    .main{
        grid-column-start:1;
        grid-column-end:3;
        background:rgb(50, 124, 151);
    }
    .sidebar{
        grid-column-start:3;
        grid-column-end:3;
        background:rgb(139, 114, 67);
    }
    .footer{
        grid-column-start:1;
        grid-column-end:4;
        background: rgb(67, 147, 67);
    }


    
</style>
<body>
    <div class="container">
        <div class="item nav">Navbar</div>
        <div class="item main">Main</div>
        <div class="item sidebar">Sidebar</div>
        <div class="item footer">Footer</div>
    </div>
</body>
</html>
